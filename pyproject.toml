[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wasitme"
version = "0.1.0"
description = "Answers one question after a Kubernetes deploy: did my change break this, or was it already broken?"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nithin K", email = "nithin@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]

[project.scripts]
wasitme = "wasitme.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
